name: Build MiniOS ISO

# Manual trigger (Actions tab -> Build MiniOS ISO -> Run workflow)
# and automatic on every push to main, so you always have a fresh ISO.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up runner disk space
        # GitHub's runners come with ~14GB actually free out of the box —
        # not enough for a full desktop live-build image. This strips
        # preinstalled toolchains we don't need (Android SDK, .NET, GHC,
        # etc.) to get back 20-30GB before we start.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout MiniOS
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Build the ISO
        working-directory: live-build
        run: sudo ./build.sh

      - name: Show build output
        working-directory: live-build
        run: ls -lh *.iso

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS-iso
          path: live-build/*.iso
          retention-days: 14
