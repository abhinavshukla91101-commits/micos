name: Build MiniOS ISO
# Manual trigger (Actions tab -> Build MiniOS ISO -> Run workflow)
# and automatic on every push to main, so you always have a fresh ISO.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run inside a real Debian bookworm container instead of directly on
    # the Ubuntu runner. Ubuntu's own `live-build` package is a ~2013-era
    # fork that predates the "bookworm" codename entirely — it doesn't
    # recognize it, falls back to Ubuntu-host defaults, and tries to
    # install ubuntu-keyring into a Debian chroot (which fails, since
    # that package doesn't exist there). Building inside actual Debian
    # sidesteps the whole class of mismatch bugs at once.
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Install git (needed for checkout inside a bare container)
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - name: Checkout MiniOS
        uses: actions/checkout@v4
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y live-build debian-archive-keyring
      - name: Build the ISO
        working-directory: live-build
        run: ./build.sh
      - name: Show build output
        working-directory: live-build
        run: ls -lh *.iso
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiniOS-iso
          path: live-build/*.iso
          retention-days: 14
